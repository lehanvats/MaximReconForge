# --- HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    server_name api.maximreconforge.tech;

    # Required for certbot's webroot challenge — must stay reachable over plain
    # HTTP even after TLS is enabled; renewals depend on it.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS for everything else. Auth cookies are Secure-only, so plain
    # HTTP cannot carry a login anyway.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real backend ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.maximreconforge.tech;

    ssl_certificate     /etc/letsencrypt/live/api.maximreconforge.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.maximreconforge.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — tell browsers to always use HTTPS for this host for 1 year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
